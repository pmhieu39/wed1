<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>AI Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
    .settings { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; }
    .message { padding: 8px; border-radius: 4px; margin: 4px 0; max-width: 80%; }
    .user { background: #e0f7fa; align-self: flex-end; }
    .ai { background: #e8f5e9; align-self: flex-start; }
    .input-row { display: flex; gap: 6px; }
    .input-row input { flex: 1; }
    #status { color: green; }
  </style>
</head>
<body>
  <h1>AI Chat</h1>
  <div class="settings">
    <label>Nhà cung cấp:
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="gemini">Gemini</option>
      </select>
    </label>
    <label>API Key: <input type="password" id="apiKey" /></label>
    <button id="saveKey">Lưu API</button>
    <span id="status"></span>
  </div>
  <div id="chat"></div>
  <div class="input-row">
    <input id="message" placeholder="Nhập tin nhắn" />
    <button id="send">Gửi</button>
  </div>
  <script>
    function appendMessage(text, cls) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'message ' + cls;
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function loadKey() {
      const provider = document.getElementById('provider').value;
      document.getElementById('apiKey').value = localStorage.getItem('apiKey_' + provider) || '';
    }

    function saveKey() {
      const provider = document.getElementById('provider').value;
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return;
      localStorage.setItem('apiKey_' + provider, key);
      const status = document.getElementById('status');
      status.textContent = 'Đã lưu!';
      setTimeout(() => status.textContent = '', 2000);
    }

    async function sendMessage() {
      const provider = document.getElementById('provider').value;
      const apiKey = document.getElementById('apiKey').value.trim();
      const messageInput = document.getElementById('message');
      const message = messageInput.value.trim();
      if (!apiKey || !message) return;
      appendMessage('<b>Bạn:</b> ' + message, 'user');
      messageInput.value = '';

      try {
        let url, headers, body;
        if (provider === 'openai') {
          url = 'https://api.openai.com/v1/chat/completions';
          headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
          body = JSON.stringify({ model: 'gpt-3.5-turbo', messages: [{ role: 'user', content: message }] });
        } else if (provider === 'anthropic') {
          url = 'https://api.anthropic.com/v1/messages';
          headers = { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' };
          body = JSON.stringify({ model: 'claude-3-sonnet-20240229', max_tokens: 300, messages: [{ role: 'user', content: message }] });
        } else if (provider === 'gemini') {
          url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
          headers = { 'Content-Type': 'application/json' };
          body = JSON.stringify({ contents: [{ parts: [{ text: message }] }] });
        }

        const response = await fetch(url, { method: 'POST', headers, body });
        const data = await response.json();
        let reply = 'Không có phản hồi';
        if (provider === 'openai') {
          reply = data?.choices?.[0]?.message?.content || reply;
        } else if (provider === 'anthropic') {
          reply = data?.content?.[0]?.text || reply;
        } else if (provider === 'gemini') {
          reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || reply;
        }
        appendMessage('<b>AI:</b> ' + reply, 'ai');
      } catch (err) {
        appendMessage('<b>Lỗi:</b> ' + err.message, 'ai');
      }
    }

    document.getElementById('send').addEventListener('click', sendMessage);
    document.getElementById('message').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    document.getElementById('saveKey').addEventListener('click', saveKey);
    document.getElementById('provider').addEventListener('change', loadKey);
    window.addEventListener('load', loadKey);
  </script>
</body>
</html>
