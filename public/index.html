<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>AI Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; }
    #chat div { margin: 4px 0; }
    #chat .user { color: blue; }
    #chat .ai { color: green; }
  </style>
</head>
<body>
  <h1>AI Chat</h1>
  <label>API Key: <input type="password" id="apiKey" /></label>
  <div id="chat"></div>
  <input id="message" placeholder="Nhập tin nhắn" />
  <button id="send">Gửi</button>
  <script>
    async function sendMessage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const messageInput = document.getElementById('message');
      const message = messageInput.value.trim();
      if (!apiKey || !message) return;
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="user"><b>Bạn:</b> ${message}</div>`;
      messageInput.value = '';
      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [{ role: 'user', content: message }]
          })
        });
        const data = await response.json();
        const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content ? data.choices[0].message.content : 'Không có phản hồi';
        chat.innerHTML += `<div class="ai"><b>AI:</b> ${reply}</div>`;
      } catch (err) {
        chat.innerHTML += `<div class="ai"><b>Lỗi:</b> ${err.message}</div>`;
      }
    }
    document.getElementById('send').addEventListener('click', sendMessage);
    document.getElementById('message').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
